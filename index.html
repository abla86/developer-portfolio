<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AB — interactive engineering profile.">
<title>AB · Interactive Engineering Profile</title>
<style>
:root{--bg:#03070d;--ink:#e9f3ff;--muted:#8298ad;--glow:#70e0b1;--line:#183044}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 35%,#102336 0,#050b12 48%,#02050a 100%);color:var(--ink);font-family:system-ui,sans-serif}body{overflow-x:hidden}a{text-decoration:none;color:inherit}
.top{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:16px 22px;background:linear-gradient(#03070ddd,transparent);pointer-events:none}.top>*{pointer-events:auto}.brand{font-weight:950;font-size:1.4rem}.brand span{color:var(--glow)}.gh{border:1px solid #274157;border-radius:10px;padding:8px 12px;color:#a9bbcc;backdrop-filter:blur(8px)}
main{min-height:100vh;display:grid;place-items:center;padding:70px 12px 30px}.world{position:relative;width:min(1200px,100%);height:min(850px,calc(100vh - 100px));min-height:650px;border-radius:34px;overflow:hidden;border:1px solid #142a3d;background:radial-gradient(circle at 50% 48%,#0c1d2a99,transparent 36%)}canvas{position:absolute;inset:0;width:100%;height:100%}
.ygg{position:absolute;inset:0;display:grid;place-items:center}.ygg svg{width:min(760px,82vw);height:88%;overflow:visible}.trunk{stroke:#35546a;stroke-width:13;fill:none;stroke-linecap:round}.branch{stroke:#274458;stroke-width:6;fill:none;stroke-linecap:round}.root{stroke:#274458;stroke-width:4;fill:none;stroke-linecap:round}.node{cursor:pointer}.orb{fill:#07131d;stroke:#3b6078;stroke-width:2;transition:.2s}.node:hover .orb,.node.active .orb{stroke:var(--glow);stroke-width:4;filter:drop-shadow(0 0 16px #70e0b155)}.node text{fill:#cfe0ef;font-size:12px;font-weight:850;text-anchor:middle;pointer-events:none}.core .orb{fill:#0b211a;stroke:var(--glow);stroke-width:3}.core text{font-size:15px}
#info{position:absolute;left:22px;bottom:22px;width:min(390px,calc(100% - 44px));padding:18px;border:1px solid #203b50;border-radius:18px;background:#03070de8;backdrop-filter:blur(16px);z-index:5;opacity:0;transform:translateY(12px);transition:.25s}.world.has-selection #info{opacity:1;transform:none}#info h2{margin:4px 0 5px;font-size:1.15rem}#info p{margin:0;color:var(--muted);font-size:.82rem}.links{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.links a{padding:7px 9px;border:1px solid #28445a;border-radius:8px;color:#b9cada;font-size:.72rem}.links a:hover{border-color:var(--glow);color:var(--glow)}
#legend{position:absolute;right:22px;bottom:22px;color:#60778b;font:600 .65rem ui-monospace,monospace;text-align:right}.pulse{position:absolute;left:50%;top:50%;width:180px;height:180px;transform:translate(-50%,-50%);border:1px solid #70e0b122;border-radius:50%;animation:pulse 3s infinite;pointer-events:none}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.22);opacity:.25}100%{transform:translate(-50%,-50%) scale(1);opacity:.7}}
@media(max-width:700px){main{padding:50px 6px 8px}.world{height:calc(100vh - 58px);min-height:620px}.ygg svg{width:96vw;height:92%}#legend{display:none}.top{padding:12px 14px}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}.node .orb{transition:none}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html">AB<span>.</span></a><a class="gh" href="https://github.com/abla86" target="_blank" rel="noopener">GitHub ↗</a></header>
<main><section class="world" id="world">
<canvas id="particles" aria-hidden="true"></canvas><div class="pulse"></div>
<div class="ygg">
<svg viewBox="0 0 760 680" role="img" aria-label="Interactive Yggdrasil engineering profile">
<path class="root" d="M380 565C270 610 190 625 105 645M380 565C490 610 570 625 655 645M380 565C330 610 300 630 250 655M380 565C430 610 460 630 510 655"/>
<path class="trunk" d="M380 570C370 500 380 440 378 380C375 310 390 250 380 110"/>
<path class="branch" d="M380 455C315 420 250 370 185 305M380 455C445 420 510 370 575 305M378 360C320 325 275 275 245 215M378 360C438 325 485 275 515 215M380 275C350 240 335 200 335 150M380 275C410 240 425 200 425 150"/>
<g class="node" data-id="typescript" transform="translate(185 300)"><circle class="orb" r="47"/><text y="4">TypeScript</text></g>
<g class="node" data-id="python" transform="translate(575 300)"><circle class="orb" r="47"/><text y="4">Python</text></g>
<g class="node" data-id="csharp" transform="translate(245 210)"><circle class="orb" r="47"/><text y="4">C# / .NET</text></g>
<g class="node" data-id="javascript" transform="translate(515 210)"><circle class="orb" r="47"/><text y="4">JavaScript</text></g>
<g class="node" data-id="sql" transform="translate(335 145)"><circle class="orb" r="43"/><text y="4">SQL</text></g>
<g class="node" data-id="infra" transform="translate(425 145)"><circle class="orb" r="43"/><text y="4">IaC / YAML</text></g>
<g class="node core" data-id="engineering" transform="translate(380 455)"><circle class="orb" r="65"/><text y="5">ENGINEERING</text></g>
</svg></div>
<div id="info"><div id="kind" style="color:var(--glow);font:800 .62rem ui-monospace,monospace;letter-spacing:.14em"></div><h2 id="title"></h2><p id="desc"></p><div class="links" id="links"></div></div>
<div id="legend">CLICK A LANGUAGE · FOLLOW THE EVIDENCE<br>YGGDRASIL / INTERACTIVE SKILL GRAPH</div>
</section></main>
<script>
(()=>{const world=document.getElementById('world'),nodes=[...document.querySelectorAll('.node')],kind=document.getElementById('kind'),title=document.getElementById('title'),desc=document.getElementById('desc'),links=document.getElementById('links');
const d={
typescript:['LANGUAGE','TypeScript','Primary full-stack language across interactive products, GitHub tooling and application platforms.',[['CodeSentinel','https://github.com/abla86/CodeSentinel'],['Book Forge','https://github.com/abla86/book-forge'],['Evidence','https://github.com/abla86/complete-evidence-appraisal-tool']]],
python:['LANGUAGE','Python','Automation, platform tooling, tracing and engineering laboratories.',[['AgentTrace','https://github.com/abla86/agenttrace'],['Engineering Lab','https://github.com/abla86/AB-Engineering-Lab']]],
csharp:['LANGUAGE','C# / .NET','Backend APIs, domain logic, healthcare systems and workforce platforms.',[['HealthTech','https://github.com/abla86/HealthTechDeviceApi'],['Vaktplan','https://github.com/abla86/workforce-competence-management'],['Cloud','https://github.com/abla86/azure-kubernetes-showcase']]],
javascript:['LANGUAGE','JavaScript','Browser interaction, frontend engineering and executable demonstrations.',[['Engineering Lab','https://github.com/abla86/AB-Engineering-Lab']]],
sql:['DATA','SQL','Relational persistence and application data models.',[['Vaktplan','https://github.com/abla86/workforce-competence-management'],['Book Forge','https://github.com/abla86/book-forge']]],
infra:['PLATFORM','IaC / YAML','Delivery, containers, Kubernetes, cloud infrastructure and automation.',[['Azure Kubernetes','https://github.com/abla86/azure-kubernetes-showcase'],['CodeSentinel','https://github.com/abla86/CodeSentinel']]],
engineering:['CORE','Engineering','The central layer connecting languages to concrete, inspectable systems.',[['All canonical platforms','https://github.com/abla86?tab=repositories']]]};
function select(id){const x=d[id];nodes.forEach(n=>n.classList.toggle('active',n.dataset.id===id));kind.textContent=x[0];title.textContent=x[1];desc.textContent=x[2];links.innerHTML=x[3].map(a=>'<a href="'+a[1]+'" target="_blank" rel="noopener">'+a[0]+' ↗</a>').join('');world.classList.add('has-selection')}
nodes.forEach(n=>{n.addEventListener('click',()=>select(n.dataset.id));n.addEventListener('mouseenter',()=>select(n.dataset.id))});
const c=document.getElementById('particles'),x=c.getContext('2d');let w,h,p=[];
function resize(){const r=c.getBoundingClientRect(),q=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=w*q;c.height=h*q;x.setTransform(q,0,0,q,0,0);p=Array.from({length:55},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.16,r:.5+Math.random()*1.4}))}
function tick(){x.clearRect(0,0,w,h);for(const a of p){a.x=(a.x+a.vx+w)%w;a.y=(a.y+a.vy+h)%h;x.fillStyle='rgba(112,224,177,.3)';x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill()}requestAnimationFrame(tick)}resize();addEventListener('resize',resize);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(tick);select('engineering')})();
</script>
</body></html>

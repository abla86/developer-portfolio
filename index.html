<!doctype html>
<html lang="en">
<head>

<title>Anne Beth System · Interactive Engineering Ecosystem</title>
<style>
:root{--bg:#050a11;--panel:#091522;--panel2:#0d1c2a;--ink:#f3f7fa;--muted:#91a8ba;--line:#20384b;--cyan:#58c7ff;--violet:#a98cff;--green:#55d58a;--amber:#ffb45c;--gold:#f1c75b;--blue:#79b8ff;--danger:#ff6f7d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% 0,#10263a 0,#050a11 42%,#03060b 100%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}button,input{font:inherit}
.skip{position:fixed;left:12px;top:12px;z-index:100;padding:10px 14px;background:#fff;color:#000;border-radius:9px;transform:translateY(-150%)}.skip:focus{transform:none}
header{display:none;position:sticky;top:0;z-index:50;background:#050a11df;border-bottom:1px solid #20384b;backdrop-filter:blur(18px)}.nav{max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 22px}.brand{font-weight:900;letter-spacing:.08em}.brand span{color:var(--cyan)}.navlinks{display:none}
main{max-width:1280px;margin:auto;padding:22px}
.hero{min-height:calc(100vh - 100px);position:relative;display:block;padding-top:18px}.hero-copy{display:none}.eyebrow{font:800 .68rem ui-monospace,monospace;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase}.hero h1{font-size:clamp(3.5rem,8vw,7rem);line-height:.9;margin:12px 0 18px;letter-spacing:-.06em}.hero h1 span{color:var(--cyan)}.hero h2{font-size:clamp(1.1rem,2.4vw,1.7rem);font-weight:500;color:#c7d8e5;margin:0 0 18px}.hero p{max-width:650px;color:var(--muted);font-size:1rem}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid #2b4d66;background:#081522;padding:11px 14px;border-radius:10px;font-size:.76rem;font-weight:850}.btn.primary{background:#0b2940;border-color:var(--cyan);box-shadow:0 0 30px #58c7ff20}.btn:hover{border-color:#fff;transform:translateY(-1px)}
.core{position:relative;min-height:calc(100vh - 150px);border:1px solid #20384b;border-radius:30px;background:#03070d;overflow:hidden;box-shadow:0 0 60px #58c7ff12}.swarm-hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.hotspot{position:absolute;display:block;width:15%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);outline:none}.hotspot:focus-visible{box-shadow:0 0 0 3px #fff,0 0 26px 8px #58c7ff}.hotspot:hover{background:radial-gradient(circle,transparent 55%,#ffffff18 58%,transparent 72%);box-shadow:0 0 30px 8px #58c7ff35}.hotspot.center{width:24%}
.modebar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 28px}.modebar button{border:1px solid #28465c;background:#081522;color:#9eb5c5;border-radius:999px;padding:9px 13px;font-size:.7rem;font-weight:850;cursor:pointer}.modebar button.active,.modebar button:hover{border-color:var(--cyan);color:#fff;background:#0b1e2d}
.section{padding:70px 0;border-top:1px solid #172c3c}.visual-portal{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.visual-link{display:block;border:1px solid #20384b;border-radius:22px;overflow:hidden;background:#050b12;transition:transform .25s,border-color .25s,box-shadow .25s}.visual-link:hover{transform:translateY(-5px);border-color:#58c7ff;box-shadow:0 18px 55px #0008,0 0 30px #58c7ff18}.visual-link img{display:block;width:100%;height:auto}.visual-link:focus-visible{outline:3px solid #fff;outline-offset:4px}.visual-caption{padding:13px 16px;color:#a9c2d1;font:800 .68rem ui-monospace,monospace;letter-spacing:.12em;text-align:center}.visual-only{padding:55px 0;min-height:70vh}.visual-only .section-head{margin-bottom:18px}.visual-only .section-head p{max-width:none}.swarm-launch{position:absolute;right:3%;bottom:4%;z-index:5}.swarm-launch{display:inline-flex;border:1px solid #58c7ff;background:#061522d9;color:#fff;padding:11px 14px;border-radius:11px;font-size:.7rem;font-weight:900;backdrop-filter:blur(12px)}@media(max-width:900px){.visual-portal{grid-template-columns:1fr}.swarm-launch{right:12px;bottom:12px}}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.section h2{font-size:clamp(1.7rem,4vw,3rem);margin:0;letter-spacing:-.04em}.section-head p{max-width:620px;color:var(--muted);margin:0}
.world-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.world-card{position:relative;min-height:220px;border:1px solid #213a4e;border-radius:18px;background:linear-gradient(145deg,#0a1723,#07111a);padding:22px;overflow:hidden;transition:.2s}.world-card:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-50px;top:-50px;background:radial-gradient(circle,var(--tone),transparent 68%);opacity:.16}.world-card:hover{transform:translateY(-3px);border-color:var(--tone)}.world-card h3{margin:8px 0;font-size:1.2rem}.world-card p{color:var(--muted);font-size:.85rem}.world-card .enter{position:absolute;bottom:18px;color:var(--tone);font:850 .68rem ui-monospace,monospace}
.trace{border:1px solid #20384b;border-radius:18px;padding:18px;background:#07111a}.trace-line{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;align-items:center}.trace-step{min-height:84px;border:1px solid #28445a;border-radius:12px;background:#081522;display:grid;place-items:center;text-align:center;padding:8px;font-size:.65rem;font-weight:800}.trace-arrow{color:#6d8799;text-align:center}
.project-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.project{border:1px solid #213a4e;border-radius:18px;background:#07111a;overflow:hidden;display:flex;flex-direction:column;min-height:250px}.project .visual{height:105px;background:radial-gradient(circle at 50% 50%,#16405d,#081522 65%);position:relative}.project .visual:after{content:"";position:absolute;inset:15px;border:1px solid #58c7ff35;border-radius:50%;box-shadow:0 0 30px #58c7ff14}.project .body{padding:16px;display:flex;flex-direction:column;flex:1}.project .domain{font:800 .58rem ui-monospace,monospace;letter-spacing:.1em;color:var(--cyan)}.project h3{font-size:1rem;margin:6px 0}.project p{color:var(--muted);font-size:.75rem;margin:0}.project .proof{margin-top:12px;color:#8da5b6;font-size:.66rem}.project .links{display:flex;gap:7px;margin-top:auto;padding-top:15px}.mini{border:1px solid #28465c;border-radius:8px;padding:7px 9px;font-size:.63rem;font-weight:800}.mini:hover{border-color:#fff}
.proof-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.proof-panel{border:1px solid #213a4e;border-radius:18px;background:#07111a;padding:22px}.proof-panel h3{margin-top:0}.proof-list{display:grid;gap:8px}.proof-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid #1b3447;border-radius:10px;background:#081522}.proof-dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:6px;flex:0 0 auto}.proof-item span{color:#a8bbc8;font-size:.78rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats img{width:100%;border:1px solid #20384b;border-radius:14px;background:#07111a}
.contact{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;border:1px solid #28465c;border-radius:22px;padding:28px;background:radial-gradient(circle at 90% 50%,#12354c,#07111a 50%)}footer{display:none;padding:40px 0 70px;color:#718b9d;font-size:.7rem;text-align:center}
.hidden{display:none!important}.low-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media(max-width:1000px){.hero-copy{position:relative;left:auto;top:auto;margin:0 0 12px}.core{min-height:560px}.project-grid{grid-template-columns:repeat(2,1fr)}.world-grid{grid-template-columns:repeat(2,1fr)}.proof-grid{grid-template-columns:1fr}}
@media(max-width:650px){main{padding:10px 12px}.hero-copy{padding:14px}.core{min-height:500px}.nav{padding:10px 12px}.navlinks{display:none}.hero{min-height:auto;padding:40px 0}.hero h1{font-size:4rem}.core{min-height:500px}.world-grid,.project-grid{grid-template-columns:1fr}.trace-line{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr}.contact{grid-template-columns:1fr}.modebar{position:sticky;top:60px;z-index:20;background:#050a11ed;padding:8px 0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.core-node circle,.world-card,.btn{transition:none}}
</style>

<script>

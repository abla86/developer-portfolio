<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Data Ocean</title><style>html,body{margin:0;min-height:100%;background:#020911;color:#dff;font-family:system-ui}main{min-height:100vh;display:grid;place-items:center;padding:30px;box-sizing:border-box}.wrap{width:min(1100px,96vw);text-align:center}canvas{width:100%;background:radial-gradient(circle at 50% 20%,#12344a,#02070d 65%);border:1px solid #16405a;border-radius:20px;box-shadow:0 0 60px #07314a;cursor:crosshair}.hud{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:14px;font:700 13px monospace}.controls button{padding:9px 15px;margin:4px;border:1px solid #28718d;border-radius:8px;background:#071b27;color:#dff;cursor:pointer}.hint{opacity:.65}</style></head><body><main><div class="wrap"><p>INTERACTIVE DATA VISUALIZATION</p><h1>3D Data Ocean</h1><p>Millions of imaginary signals become a calm, living ocean. Drag to rotate, scroll to change depth.</p><div class="hud"><span id="mode">FLOW · LIVE</span><span id="depth">DEPTH 50</span><span id="nodes">NODES 0</span></div><canvas id="ocean" width="1100" height="620"></canvas><div class="controls"><button id="pause">Pause</button><button id="storm">Data Storm</button><button id="calm">Calm</button></div><p class="hint">Drag · scroll · click a signal</p></div></main><script>
const c=document.getElementById('ocean'),x=c.getContext('2d'),W=c.width,H=c.height;let paused=false,depth=50,rot=0,drag=false,lastX=0,energy=1,selected=-1;const pts=Array.from({length:520},(_,i)=>({a:Math.random()*Math.PI*2,r:Math.random()*1,x:0,y:0,z:Math.random()*2-1,s:Math.random()*1.8+.5}));function project(p,t){const rr=p.r*420,xx=Math.cos(p.a+t*.00012)*rr,zz=Math.sin(p.a+t*.00012)*rr;const wave=Math.sin(p.a*7+t*.0015+p.z*4)*22*energy+Math.cos(p.a*13-t*.001)*10;const y=H*.56+wave+p.z*depth*1.7;const scale=1/(1.3+zz/700);return [W/2+xx*scale,y*scale+(1-scale)*H*.45,scale]}function frame(t){x.fillStyle=paused?'rgba(2,9,17,.06)':'rgba(2,9,17,.22)';x.fillRect(0,0,W,H);if(!paused){pts.forEach(p=>{p.a+=.0007*p.s*energy});}pts.forEach((p,i)=>{const[q,y,s]=project(p,t);p.sx=q;p.sy=y;const near=Math.hypot(q-W/2,y-H/2)<130;const active=i===selected; x.beginPath();x.arc(q,y,Math.max(.7,3*s),0,7);x.fillStyle=active?'rgba(255,230,130,1)':near?'rgba(100,225,255,.95)':'rgba(35,150,190,'+(0.25+s*.22)+')';x.fill();if(i%17===0){x.beginPath();x.moveTo(q,y);x.lineTo(q+18*s,y-9*s);x.strokeStyle='rgba(70,190,220,.12)';x.stroke()}});document.getElementById('nodes').textContent='NODES '+pts.length;document.getElementById('depth').textContent='DEPTH '+depth;requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';document.getElementById('mode').textContent=paused?'FLOW · PAUSED':'FLOW · LIVE'};document.getElementById('storm').onclick=()=>{energy=3;setTimeout(()=>energy=1,3500);document.getElementById('mode').textContent='FLOW · STORM'};document.getElementById('calm').onclick=()=>{energy=.35;setTimeout(()=>energy=1,3500);document.getElementById('mode').textContent='FLOW · CALM'};c.onpointerdown=e=>{drag=true;lastX=e.clientX};c.onpointerup=()=>drag=false;c.onpointerleave=()=>drag=false;c.onpointermove=e=>{if(drag){rot+=(e.clientX-lastX)*.01;lastX=e.clientX}};c.onwheel=e=>{e.preventDefault();depth=Math.max(10,Math.min(120,depth+(e.deltaY>0?-5:5)))};c.onclick=e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;document.getElementById('mode').textContent='SIGNAL · '+Math.round(Math.hypot(mx-W/2,my-H/2))+'px FROM CORE'};</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yggdrasil — Rune Tree</title><style>body{margin:0;background:#070b0a;color:#e8f5e9;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(1050px,94vw);text-align:center}canvas{width:100%;max-width:1000px;background:#09120d;border:1px solid #294638;border-radius:18px;cursor:pointer}button{padding:10px 16px;margin:5px;border:1px solid #55765f;background:#102017;color:#e8f5e9;border-radius:9px;cursor:pointer}output{display:block;font:700 18px monospace;margin:12px}.hint{opacity:.7}</style></head><body><main><p>INTERACTIVE NORSE LAB</p><h1>Yggdrasil · Rune Tree</h1><p>Explore the nine worlds through a living interactive world-tree.</p><output id="info">Choose a world or rune</output><canvas id="tree" width="1000" height="620"></canvas><div><button id="grow">Grow Yggdrasil</button><button id="reset">Reset</button></div><p class="hint">Click a world node to inspect it. Click runes to activate their signal.</p></main><script>const c=document.getElementById('tree'),x=c.getContext('2d'),info=document.getElementById('info');let growth=0,runing=false,energy=0,selected=-1;const worlds=[['Asgard','Gods'],['Midgard','Humans'],['Vanaheim','Vanir'],['Jotunheim','Giants'],['Alfheim','Elves'],['Svartalfheim','Dwarves'],['Niflheim','Ice'],['Muspelheim','Fire'],['Helheim','Dead']];const runes=['ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᛏ','ᛒ','ᛟ'];const runeNames=['wealth','strength','force','wisdom','journey','justice','growth','heritage'];let nodes=[];function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='rgba(7,11,10,.35)';x.fillRect(0,0,c.width,c.height);x.lineCap='round';x.strokeStyle='#5b8265';x.lineWidth=18;x.beginPath();x.moveTo(500,610);x.bezierCurveTo(430,470,570,360,500,240);x.bezierCurveTo(450,160,500,100,500,35);x.stroke();x.lineWidth=9;worlds.forEach((w,i)=>{const a=-Math.PI/2+i*Math.PI*2/9;const rad=180+Math.sin(i*1.7+growth)*25;const px=500+Math.cos(a)*rad,py=300+Math.sin(a)*rad*.72;nodes[i]={x:px,y:py,name:w[0],desc:w[1]};x.strokeStyle='#3c6048';x.beginPath();x.moveTo(500,300);x.lineTo(px,py);x.stroke();x.beginPath();x.arc(px,py,25,0,7);x.fillStyle='#10251a';x.fill();x.strokeStyle='#7aa987';x.stroke();x.fillStyle='#dcefe0';x.font='700 15px system-ui';x.textAlign='center';x.fillText(w[0],px,py+5);if(i===selected){x.strokeStyle='#d7c46a';x.lineWidth=3;x.beginPath();x.arc(px,py,34,0,7);x.stroke()}});runes.forEach((r,i)=>{const px=70+i*122,py=570+Math.sin(growth*2+i)*5;x.fillStyle='#d6e8d8';x.font='28px serif';x.fillText(r,px,py)});growth+=runing?.01:0;requestAnimationFrame(draw)}draw();document.getElementById('grow').onclick=()=>{runing=true;info.value='Yggdrasil is growing…';setTimeout(()=>runing=false,3000)};document.getElementById('reset').onclick=()=>{growth=0;runing=false;info.value='Yggdrasil restored'};c.onclick=e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*c.width/r.width,my=(e.clientY-r.top)*c.height/r.height;const n=nodes.find(node=>Math.hypot(node.x-mx,node.y-my)<32);if(n){selected=worlds.findIndex(w=>w[0]===n.name);energy=Math.min(100,energy+10);info.value=n.name+' · '+n.desc+' · signal '+energy+'%';return}if(my>530){const i=Math.max(0,Math.min(runes.length-1,Math.round((mx-70)/122)));energy=Math.min(100,energy+5);info.value='Rune '+runes[i]+' activated · '+runeNames[i]}};</script></body></html>

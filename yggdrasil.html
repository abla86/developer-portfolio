map{border-radius:20px}.node text{font-size:12px}}</style></head><body><main class="wrap"><header class="head"><a href="index.html">← Profile</a><span class="eyebrow">INTERACTIVE MAP</span></header><section class="title"><p class="eyebrow">YGGDRASIL · ENGINEERING WORLD</p><h1>Explore the tree.</h1><p>Capabilities connect to real work. Select a node.</p></section><div class="map"><svg viewBox="0 0 760 760" role="img" aria-labelledby="t d"><title id="t">Yggdrasil engineering map</title><desc id="d">Interactive engineering capabilities connected through a central system.</desc><g><path class="branch" d="M380 680 C365 590 390 520 378 445 C365 360 300 315 205 250"/><path class="branch" d="M380 590 C430 535 500 500 590 450"/><path class="branch" d="M378 500 C310 465 245 450 145 440"/><path class="branch" d="M378 450 C445 395 505 355 625 335"/><path class="branch" d="M378 410 C335 345 300 285 285 170"/><path class="branch" d="M380 410 C430 345 475 285 500 165"/><path class="branch" d="M378 450 C470 470 535 545 600 610"/></g><circle class="orbit" cx="380" cy="445" r="150"/><circle class="orbit" cx="380" cy="445" r="195"/><g class="node" tabindex="0" data-name="React" data-info="Interfaces, component systems and interactive UX." onclick="select(this)" onkeydown="key(event,this)"><circle cx="205" cy="250" r="12"/><text x="172" y="226">React</text></g><g class="node" tabindex="0" data-name="C# / .NET" data-info="APIs, services and application architecture." onclick="select(this)" onkeydown="key(event,this)"><circle cx="590" cy="450" r="12"/><text x="610" y="456">C# / .NET</text></g><g class="node" tabindex="0" data-name="Python" data-info="Data, analysis and automation." onclick="select(this)" onkeydown="key(event,this)"><circle cx="145" cy="440" r="12"/><text x="95" y="470">Python</text></g><g class="node" tabindex="0" data-name="Cloud" data-info="Azure, containers, Kubernetes and delivery." onclick="select(this)" onkeydown="key(event,this)"><circle cx="285" cy="170" r="12"/><text x="255" y="142">Cloud</text></g><g class="node" tabindex="0" data-name="Security" data-info="Security engineering, controls and resilience." onclick="select(this)" onkeydown="key(event,this)"><circle cx="500" cy="165" r="12"/><text x="512" y="140">Security</text></g><g class="node" tabindex="0" data-name="Systems" data-info="Integration, edge systems and reusable patterns." onclick="select(this)" onkeydown="key(event,this)"><circle cx="625" cy="335" r="12"/><text x="642" y="340">Systems</text></g><g class="node" tabindex="0" data-name="Data" data-info="Data quality, traceability and evidence." onclick="select(this)" onkeydown="key(event,this)"><circle cx="600" cy="610" r="12"/><text x="615" y="635">Data</text></g><g class="core"><circle cx="380" cy="445" r="24"/><text x="380" y="449" text-anchor="middle">CORE</text></g></svg><div class="panel" id="panel"><strong>Select a capability</strong><span>Click or focus a node to explore the map.</span></div></div><div class="hint"><strong>INTERACTIVE</strong> · Click the glowing nodes</div></main><script>function select(n){document.querySelectorAll('.node').forEach(x=>x.classList.remove('selected'));n.classList.add('selected');document.querySelector('#panel strong').textContent=n.dataset.name;document.querySelector('#panel span').textContent=n.dataset.info}function key(e,n){if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n)}}</script></body></html>

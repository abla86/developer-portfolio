<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matrix Wolf</title><style>body{margin:0;background:#020609;color:#eafff7;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(1100px,94vw);text-align:center}canvas{width:100%;border:1px solid #16483a;border-radius:18px;background:#020609;box-shadow:0 0 70px #06382a55;cursor:crosshair}button{padding:10px 16px;margin:12px 5px;background:#07150f;color:#bfffe4;border:1px solid #286a51;border-radius:9px;cursor:pointer}output{display:block;color:#70e0b1;font:700 12px monospace}</style></head><body><main class="wrap"><p>MATRIX · GENERATIVE SIGNAL</p><h1>WOLF SIGNAL</h1><p>Move the pointer through the code rain. Click to pulse the signal.</p><canvas id="c" width="1100" height="620" aria-label="Interactive Matrix wolf"></canvas><output id="o">SIGNAL · SCANNING</output><button id="pulse">Pulse Wolf</button><button id="clear">Reset Signal</button></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),W=c.width,H=c.height,C='01アイウエオ狼ᚠᚢᚦ<>/';let drops=Array.from({length:90},()=>Math.random()*H),mx=W/2,my=H/2,pulse=0;function inside(a,b){const nx=(a-W/2)/250,ny=(b-H/2)/190;return Math.abs(nx)<.78&&ny>-0.85&&ny<.72&&(Math.abs(ny)<.38||Math.abs(nx)<.45)||Math.abs(nx)>.34&&Math.abs(nx)<.82&&ny>-.98&&ny<-.4}c.onpointermove=e=>{const r=c.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height};c.onclick=()=>{pulse=1;document.getElementById('o').value='SIGNAL · PULSE'};document.getElementById('pulse').onclick=()=>{pulse=1;document.getElementById('o').value='SIGNAL · PULSE'};document.getElementById('clear').onclick=()=>{drops=Array.from({length:90},()=>Math.random()*H);pulse=0};function loop(t){x.fillStyle='rgba(2,6,9,.2)';x.fillRect(0,0,W,H);for(let i=0;i<90;i++){let y=drops[i],px=i*12.4,hit=inside(px,y),near=Math.hypot(px-mx,y-my)<125;x.fillStyle=hit?(pulse?'rgba(255,210,120,.95)':'rgba(120,255,200,.95)'):near?'rgba(90,220,255,.9)':'rgba(50,190,130,.48)';x.font='14px monospace';x.fillText(C[(Math.random()*C.length)|0],px,y);drops[i]+=5+(pulse?4:0);if(drops[i]>H+30)drops[i]=-10}if(pulse){pulse*=.94;if(pulse<.03)pulse=0}requestAnimationFrame(loop)}loop(0)</script></body></html>

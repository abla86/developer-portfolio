<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title>Git branching network illustration</title><desc>A stylized Git graph with branching paths and commit nodes.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#07101d"/></linearGradient></defs>
<rect width="800" height="500" rx="32" fill="url(#bg)"/>
<g fill="none" stroke="#50677d" stroke-width="5" stroke-linecap="round"><path d="M130 390C130 300 130 190 130 90"/><path d="M130 275C240 275 275 180 380 180S520 105 670 105"/><path d="M380 180C455 180 480 330 600 330S650 275 670 245"/></g>
<g fill="#0b1827" stroke="#70e0b1" stroke-width="5"><circle cx="130" cy="390" r="15"/><circle cx="130" cy="275" r="15"/><circle cx="130" cy="90" r="15"/><circle cx="380" cy="180" r="15"/><circle cx="670" cy="105" r="15"/><circle cx="600" cy="330" r="15"/><circle cx="670" cy="245" r="15"/></g>
<g fill="#7da7ff"><circle cx="130" cy="330" r="5"/><circle cx="130" cy="220" r="5"/><circle cx="235" cy="275" r="5"/><circle cx="520" cy="330" r="5"/><circle cx="550" cy="125" r="5"/></g>
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" fill="#dbe8f5"><text x="48" y="55" font-size="17" font-weight="700" letter-spacing="3">VERSIONED THINKING</text><text x="48" y="455" font-size="18" fill="#9eabc0">GIT · BRANCHES · COMMITS · COLLABORATION</text></g>
</svg>
title: Energy Intelligence
views:
  - title: Energy
    path: energy
    icon: mdi:lightning-bolt
    cards:
      - type: heading
        heading: Energy Intelligence
        heading_style: title
      - type: grid
        columns: 3
        square: false
        cards:
          - type: gauge
            entity: sensor.home_power
            name: Nå
            min: 0
            max: 12000
            severity:
              green: 0
              yellow: 4000
              red: 8000
          - type: tile
            entity: sensor.daily_energy
            name: I dag
          - type: tile
            entity: sensor.monthly_energy
            name: Denne måneden
      - type: history-graph
        title: Forbruk siste 24 timer
        hours_to_show: 24
        entities:
          - sensor.home_power

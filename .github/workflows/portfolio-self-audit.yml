name: Portfolio Self Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit-and-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit and safe repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/portfolio-audit.mjs

      - name: Create repair PR when safe fixes were made
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No safe repairs required."
            exit 0
          fi

          git config user.name "portfolio-self-audit[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "automation/portfolio-self-audit"
          git add -A
          git commit -m "chore: apply safe portfolio audit repairs"
          git push --force-with-lease origin "automation/portfolio-self-audit"

          gh pr create             --base main             --head "automation/portfolio-self-audit"             --title "chore: automated portfolio audit repairs"             --body "Automated audit found deterministic, low-risk repairs. The repair commit is isolated in this PR for review."

name: CodeSentinel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Inspect registered GitHub projects
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-project-inspector.mjs

      - name: Run CodeSentinel preflight and safe repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/codesentinel.mjs

      - name: Commit verified project facts
        if: github.event_name != 'pull_request'
        run: |
          comparison=$(node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const file = "scripts/project-facts.generated.json";
          const current = JSON.parse(fs.readFileSync(file, "utf8"));
          let previous;
          try {
            previous = JSON.parse(execFileSync("git", ["show", `HEAD:${file}`], { encoding: "utf8" }));
          } catch {
            console.log("changed");
            process.exit(0);
          }
          delete current.generatedAt;
          delete previous.generatedAt;
          console.log(JSON.stringify(current) === JSON.stringify(previous) ? "same" : "changed");
          NODE
          )
          if [ "$comparison" = "same" ]; then
            echo "Verified project facts are unchanged; timestamp-only update skipped."
            exit 0
          fi
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "CodeSentinel[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/project-facts.generated.json
          git commit -m "chore: refresh verified project facts [skip ci]"
          git push

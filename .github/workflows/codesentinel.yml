name: CodeSentinel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect registered GitHub projects
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-project-inspector.mjs

      - name: Run CodeSentinel preflight and safe repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/codesentinel.mjs

      - name: Commit verified project facts
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "CodeSentinel[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/project-facts.generated.json
          git commit -m "chore: refresh verified project facts [skip ci]"
          git push

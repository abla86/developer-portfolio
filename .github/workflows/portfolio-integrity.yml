name: Portfolio integrity

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "scripts/verify-portfolio.mjs"
      - ".github/workflows/portfolio-integrity.yml"
      - "README.md"
      - "readme.md"
      - "data/ecosystem.json"
      - "scripts/project-registry.json"
  pull_request:
    branches: [main]
    paths:
      - "**.html"
      - "scripts/verify-portfolio.mjs"
      - ".github/workflows/portfolio-integrity.yml"
      - "README.md"
      - "readme.md"
      - "data/ecosystem.json"
      - "scripts/project-registry.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: Verify public portfolio entry points
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify portfolio entry points
        run: node scripts/verify-portfolio.mjs

name: Verify interactive site
on:
  push:
    branches: [main,master]
  pull_request:
    branches: [main,master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check interactive HTML
        run: |
          test -f index.html
          files=$(find . -maxdepth 1 -type f -name '*.html' | wc -l)
          test "$files" -gt 0
          grep -Rqi '<script' --include='*.html' .
          grep -Rqi '<button\|addEventListener\|onclick' --include='*.html' .
          echo "Root interactive HTML files: $files"
          test -f game-lab/index.html
      - name: Syntax-check JavaScript
        run: |
          mapfile -t jsfiles < <(find . -type f -name "*.js" -not -path "./node_modules/*")
          test "${#jsfiles[@]}" -gt 0
          for f in "${jsfiles[@]}"; do node --check "$f"; done
          echo "JavaScript syntax checks passed: ${#jsfiles[@]}"
      - name: Check interactive engine wiring
        run: |
          grep -q "CyberChessEngine" game-lab/index.html
          grep -q "Connect4Engine" game-lab/index.html
          grep -q "SqlDungeonEngine" game-lab/index.html
          grep -q "NetworkDefenderEngine" game-lab/index.html
          for f in game-lab/js/engines/*.js; do test -s "$f"; done
          echo "All Game Lab engines are present and wired"
      - name: Check broken local references
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in Path("docs").glob("*.html"):
              s=f.read_text(encoding="utf-8",errors="ignore")
              if "<html" not in s.lower() or "</html>" not in s.lower():
                  raise SystemExit(f"Malformed HTML: {f}")
          print("HTML structure checks passed")
          PY
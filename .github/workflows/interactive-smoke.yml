name: Verify interactive site
on:
  push:
    branches: [main,master]
  pull_request:
    branches: [main,master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check interactive HTML
        run: |
          test -f index.html
          files=$(find . -maxdepth 1 -type f -name '*.html' | wc -l)
          test "$files" -gt 0
          grep -Rqi '<script' --include='*.html' .
          grep -Rqi '<button\|addEventListener\|onclick' --include='*.html' .
          echo "Root interactive HTML files: $files"
          test -f game-lab/index.html
      - name: Syntax-check JavaScript
        run: |
          mapfile -t jsfiles < <(find . -type f -not -path './archive/*' -name "*.js" -not -path "./node_modules/*")
          test "${#jsfiles[@]}" -gt 0
          for f in "${jsfiles[@]}"; do node --check "$f"; done
          echo "JavaScript syntax checks passed: ${#jsfiles[@]}"
      - name: Check interactive engine wiring
        run: |
          grep -q "CyberChessEngine" game-lab/index.html
          grep -q "Connect4Engine" game-lab/index.html
          grep -q "SqlDungeonEngine" game-lab/index.html
          grep -q "NetworkDefenderEngine" game-lab/index.html
          for f in game-lab/js/engines/*.js; do test -s "$f"; done
          echo "All Game Lab engines are present and wired"
      - name: Check HTML structure and local references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path(".").resolve()
          files={str(p.relative_to(root)).replace("\\","/") for p in root.rglob("*") if p.is_file() and p.relative_to(root).parts[0] != "archive"}
          for p in (q for q in root.rglob("*.html") if q.relative_to(root).parts[0] != "archive"):
              rel=str(p.relative_to(root)).replace("\\","/")
              s=p.read_text(encoding="utf-8",errors="ignore")
              if "<html" not in s.lower() or "</html>" not in s.lower():
                  raise SystemExit(f"Malformed HTML: {rel}")
              for m in re.finditer(r'(?:href|src)=["\']([^"\'#?]+)',s,re.I):
                  t=m.group(1)
                  if t.startswith(("http:","https:","mailto:","tel:","data:","javascript:")): continue
                  target=(p.parent/t).resolve()
                  if target.is_dir(): target=target/"index.html"
                  try: ok=target.is_file() and target.is_relative_to(root)
                  except AttributeError: ok=target.is_file() and str(target).startswith(str(root))
                  if not ok: raise SystemExit(f"Broken local reference: {rel} -> {t}")
          print("HTML structure and local-reference checks passed")
          PY
      - name: Check fragment targets and duplicate IDs
        run: |
          python - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path(".").resolve()
          pages = [p for p in root.rglob("*.html") if p.relative_to(root).parts[0] not in {"archive", "node_modules"}]

          class AuditParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.refs = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"):
                      self.ids.append(attrs["id"])
                  for key in ("href", "src"):
                      if attrs.get(key):
                          self.refs.append(attrs[key])

              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

          documents = {}
          for page in pages:
              parser = AuditParser()
              parser.feed(page.read_text(encoding="utf-8", errors="ignore"))
              documents[page.resolve()] = parser
              duplicates = [value for value, count in Counter(parser.ids).items() if count > 1]
              if duplicates:
                  raise SystemExit(f"Duplicate HTML IDs in {page.relative_to(root)}: {duplicates}")

          for page, parser in documents.items():
              for ref in parser.refs:
                  parts = urlsplit(ref)
                  if parts.scheme or parts.netloc:
                      continue
                  path = unquote(parts.path)
                  if path.startswith("/"):
                      target = (root / path.lstrip("/")).resolve()
                  elif path:
                      target = (page.parent / path).resolve()
                  else:
                      target = page
                  if target.is_dir():
                      target = target / "index.html"
                  try:
                      target.relative_to(root)
                  except ValueError:
                      raise SystemExit(f"Reference escapes site root: {page.relative_to(root)} -> {ref}")
                  if not target.is_file():
                      raise SystemExit(f"Broken local reference: {page.relative_to(root)} -> {ref}")
                  if parts.fragment and target.suffix.lower() == ".html":
                      target_doc = documents.get(target.resolve())
                      if target_doc and unquote(parts.fragment) not in target_doc.ids:
                          raise SystemExit(f"Broken fragment: {page.relative_to(root)} -> {ref}")

          print(f"Fragment, duplicate-ID and local-reference checks passed: {len(pages)} HTML pages")
          PY
      - name: Check project catalogue filter metadata
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ProjectParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.cards = []

              def handle_starttag(self, tag, attrs):
                  if tag == "article":
                      values = dict(attrs)
                      if "project" in values.get("class", "").split():
                          self.cards.append(values)

          html = Path("projects.html").read_text(encoding="utf-8")
          parser = ProjectParser()
          parser.feed(html)
          cards = parser.cards
          if not cards:
              raise SystemExit("No project cards found")
          missing = [str(i + 1) for i, card in enumerate(cards) if not card.get("data-category") or not card.get("data-search")]
          if missing:
              raise SystemExit("Project cards missing search/filter metadata: " + ", ".join(missing))
          if "c.dataset.search||c.textContent" not in html:
              raise SystemExit("Project search does not contain a safe fallback for cards without search metadata")
          print(f"Project catalogue metadata passed: {len(cards)} cards")
          PY

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-metadata:
    name: Python metadata generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q scripts
      - name: Run metadata tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check generated files are not tracked as test artifacts
        run: git diff --exit-code -- . ':(exclude)scripts'

name: Home Assistant dashboard validation

on:
  push:
    paths:
      - 'home-assistant/**'
      - '.github/workflows/ha-dashboard-validation.yml'
  pull_request:
    paths:
      - 'home-assistant/**'
      - '.github/workflows/ha-dashboard-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-input PyYAML

      - name: Validate dashboard YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path("home-assistant/dashboards")
          files = sorted(root.glob("*.yaml"))
          if len(files) < 6:
              raise SystemExit(f"Expected at least 6 dashboard files, found {len(files)}")

          for path in files:
              with path.open("r", encoding="utf-8") as fh:
                  data = yaml.safe_load(fh)
              if not isinstance(data, dict):
                  raise SystemExit(f"{path}: root must be a mapping")
              if "views" not in data or not isinstance(data["views"], list):
                  raise SystemExit(f"{path}: missing views list")
              print(f"validated {path}")

          print(f"validated {len(files)} Home Assistant dashboard files")
          PY

      - name: Secret filename guard
        shell: bash
        run: |
          if find home-assistant -type f \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '.env' -o -name '.env.*' \) -print -quit | grep -q .; then
            echo "Potential secret file tracked under home-assistant/"
            exit 1
          fi

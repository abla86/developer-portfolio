<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network Flow Simulator</title><style>body{margin:0;background:#03080d;color:#dff7ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(1100px,95vw);text-align:center}canvas{width:100%;border:1px solid #16445a;border-radius:18px;background:#02060a;cursor:pointer;touch-action:none}.hud{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;font:700 13px monospace;margin:12px}.controls button{margin:4px;padding:9px 15px;border:1px solid #28647a;border-radius:8px;background:#0b1720;color:#dff7ff;cursor:pointer}.hint{opacity:.65}</style></head><body><main class="wrap"><p>NETWORK ENGINEERING · CANVAS</p><h1>Network Flow Simulator</h1><p>Build a live network and watch packets route between nodes. Click nodes to toggle them offline.</p><div class="hud"><span id="status">NETWORK · ONLINE</span><span id="packets">PACKETS 0</span><span id="lost">LOST 0</span></div><canvas id="net" width="1100" height="580"></canvas><div class="controls"><button id="add">Add Node</button><button id="burst">Packet Burst</button><button id="reset">Reset Network</button></div><p class="hint">Click a node · add nodes · inject traffic</p></main><script>
const c=document.getElementById('net'),x=c.getContext('2d'),W=c.width,H=c.height;let nodes=[],packets=[],lost=0;function reset(){nodes=[{x:150,y:290,on:true},{x:330,y:150,on:true},{x:330,y:430,on:true},{x:560,y:290,on:true},{x:790,y:150,on:true},{x:790,y:430,on:true},{x:970,y:290,on:true}];packets=[];lost=0}reset();
function nearest(a){let best=null,d=1e9;nodes.forEach((b,i)=>{if(b.on&&b!==a){const z=Math.hypot(a.x-b.x,a.y-b.y);if(z<d){d=z;best=b}}});return best}
function spawn(){const live=nodes.filter(n=>n.on);if(live.length>1){const a=live[(Math.random()*live.length)|0],b=live[(Math.random()*live.length)|0];if(a!==b)packets.push({a,b,t:0})}}
document.getElementById('burst').onclick=()=>{for(let i=0;i<35;i++)spawn()};document.getElementById('add').onclick=()=>nodes.push({x:120+Math.random()*860,y:80+Math.random()*420,on:true});document.getElementById('reset').onclick=reset;
c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;const n=nodes.find(n=>Math.hypot(n.x-mx,n.y-my)<24);if(n)n.on=!n.on});
function loop(){x.fillStyle='rgba(2,6,10,.28)';x.fillRect(0,0,W,H);nodes.forEach(a=>nodes.forEach(b=>{if(a!==b&&a.on&&b.on&&a.x<b.x&&Math.hypot(a.x-b.x,a.y-b.y)<300){x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.strokeStyle='rgba(70,180,215,.22)';x.stroke()}}));if(Math.random()<.07)spawn();packets.forEach(p=>{if(!p.a.on||!p.b.on){lost++;p.dead=true;return}p.t+=.012;const q=nearest(p.a)||p.b;const target=p.t<1?p.b:q;p.x=p.a.x+(target.x-p.a.x)*Math.min(p.t,1);p.y=p.a.y+(target.y-p.a.y)*Math.min(p.t,1)});packets=packets.filter(p=>{if(p.t>=1){p.a=p.b;p.b=nodes.filter(n=>n.on&&n!==p.a)[(Math.random()*Math.max(1,nodes.filter(n=>n.on&&n!==p.a).length))|0];p.t=0;if(!p.b)return false}return !p.dead});nodes.forEach(n=>{x.beginPath();x.arc(n.x,n.y,n.on?21:17,0,7);x.fillStyle=n.on?'#0d2832':'#301719';x.fill();x.strokeStyle=n.on?'#65e6ff':'#ff5555';x.lineWidth=2;x.stroke();x.fillStyle='#dff';x.font='12px monospace';x.textAlign='center';x.fillText(n.on?'ONLINE':'OFFLINE',n.x,n.y+40)});packets.forEach(p=>{if(p.x){x.beginPath();x.arc(p.x,p.y,5,0,7);x.fillStyle='#fff';x.fill()}});document.getElementById('packets').textContent='PACKETS '+packets.length;document.getElementById('lost').textContent='LOST '+lost;document.getElementById('status').textContent='NETWORK · '+nodes.filter(n=>n.on).length+'/'+nodes.length+' ONLINE';requestAnimationFrame(loop)}loop();
</script></body></html>

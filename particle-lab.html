<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Particle Lab</title><style>body{margin:0;background:#05080d;color:#e7faff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(1100px,95vw);text-align:center}canvas{width:100%;border:1px solid #183848;border-radius:18px;background:#02060a;cursor:crosshair;touch-action:none}.hud{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;font:700 13px monospace;margin:12px}.controls button{margin:4px;padding:9px 15px;border:1px solid #28647a;border-radius:8px;background:#0b1720;color:#e7faff;cursor:pointer}</style></head><body><div class="wrap"><p>GENERATIVE COMPUTING · CANVAS</p><h1>Particle Lab</h1><p>Interact with a live particle field. Attract, repel and inject energy into the system.</p><div class="hud"><span id="mode">MODE ATTRACT</span><span id="count">PARTICLES 700</span></div><canvas id="p" width="1100" height="580"></canvas><div class="controls"><button id="modeBtn">Switch: Repel</button><button id="burst">Energy Burst</button><button id="clear">Reset Field</button></div></div><script>const c=document.getElementById('p'),x=c.getContext('2d'),W=c.width,H=c.height,N=700;let mode=1,mx=W/2,my=H/2,energy=1,ps=[],paused=false;function reset(){ps=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.8,r:Math.random()*2+1}))}reset();c.onpointermove=e=>{const r=c.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height};c.onpointerdown=e=>{for(let i=0;i<30;i++)ps.push({x:mx+(Math.random()-.5)*30,y:my+(Math.random()-.5)*30,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,r:Math.random()*2+1});setTimeout(()=>ps.splice(N),300)};document.getElementById('modeBtn').onclick=e=>{mode*=-1;e.target.textContent=mode===1?'Switch: Repel':'Switch: Attract';document.getElementById('mode').textContent='MODE '+(mode===1?'ATTRACT':'REPEL')};document.getElementById('burst').onclick=()=>{energy=5;setTimeout(()=>energy=1,1800)};document.getElementById('clear').onclick=reset;const pause=document.createElement('button');pause.textContent='Pause';pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Resume':'Pause'};document.querySelector('.controls').appendChild(pause);function loop(){if(!paused){x.fillStyle='rgba(2,6,10,.22)';x.fillRect(0,0,W,H);ps.forEach(p=>{let dx=mx-p.x,dy=my-p.y,d=Math.max(30,Math.hypot(dx,dy)),f=(mode*energy*18)/(d*d);p.vx+=dx/d*f;p.vy+=dy/d*f;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba(80,210,235,.8)';x.fill()});document.getElementById('count').textContent='PARTICLES '+ps.length;}requestAnimationFrame(loop)}loop();</script></body></html>
